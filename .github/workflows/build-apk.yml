name: Build Android APK
on:
  push:
    branches: [ feature/symmetry-pro-app ]
  pull_request:
    branches: [ feature/symmetry-pro-app ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable (if exists)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi

      - name: Set up Flutter (optional, speeds Flutter builds)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Build APK (detects Flutter, Android native or React Native)
        run: |
          set -e
          if [ -f "pubspec.yaml" ]; then
            echo "Detected Flutter project -> building APK (debug)"
            flutter pub get
            flutter build apk --debug
          elif [ -f "gradlew" ]; then
            echo "Detected Android Gradle wrapper at repo root -> building APK (debug)"
            ./gradlew assembleDebug --no-daemon
          elif [ -f "android/gradlew" ]; then
            echo "Detected Android Gradle wrapper in android/ -> building APK (debug)"
            cd android
            ./gradlew assembleDebug --no-daemon
            cd ..
          else
            echo "No Android or Flutter project files found (pubspec.yaml or gradlew)." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            build/app/outputs/**/*.apk
            app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.apk
            **/app-debug.apk